# Servidor estático compartido por web-guest y web-host (SPAs de Vite).
# El fallback a /index.html es obligatorio: /join/:slug y /host/:slug son
# rutas del cliente (TanStack Router), no archivos.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # index.html sin cache: siempre consulta los assets hasheados frescos.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Assets con hash en el nombre (Vite): inmutables, cache larga.
    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fallback SPA para las demás rutas.
    location / {
        try_files $uri $uri/ /index.html;
    }
}